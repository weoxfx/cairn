name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rustflags: "-C target-feature=+crt-static"
            packages: musl-tools
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rustflags: "-C linker=aarch64-linux-gnu-gcc"
            packages: gcc-aarch64-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
            rustflags: ""
            packages: ""
          - os: macos-26
            target: aarch64-apple-darwin
            rustflags: ""
            packages: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: ""
            packages: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
      - name: Install build packages
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Build release binary
        env:
          MATRIX_RUSTFLAGS: ${{ matrix.rustflags }}
          SOURCE_DATE_EPOCH: "0"
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          export RUSTFLAGS="$MATRIX_RUSTFLAGS --remap-path-prefix=$PWD=/cairn --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Smoke test
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          "./target/${{ matrix.target }}/release/cairn" --help >/dev/null
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/${{ matrix.target }}/release/cairn.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "cairn-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/cairn.exe" "dist/$name/cairn.exe"
          Copy-Item README.md,SECURITY.md,LICENSE-APACHE,LICENSE-MIT "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse -Force "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip"
      - name: Package release
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="cairn-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/cairn" "dist/$name/cairn"
          cp README.md SECURITY.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      # Optional: a passwordless minisign secret key. When set, SHA256SUMS is
      # signed and install.sh can verify it with CAIRN_MINISIGN_PUBKEY.
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Build checksum manifest
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort > SHA256SUMS
      - name: Sign checksum manifest
        if: env.MINISIGN_SECRET_KEY != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          chmod 600 "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m dist/SHA256SUMS \
            -x dist/SHA256SUMS.minisig
          rm -f "$RUNNER_TEMP/minisign.key"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
