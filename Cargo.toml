[package]
name = "cairn"
version = "0.2.0"
edition = "2021"
description = "Experimental open-source Bitcoin CLI wallet (testnet by default; unaudited mainnet opt-in)"
license = "MIT OR Apache-2.0"

[lib]
name = "cairn"
path = "src/lib.rs"
# Fuzz/integration surface. Unit tests belong to the binary target.
test = false
doctest = false

[features]
# Enables fuzzing-only entry points. The shipped binary never enables this.
fuzzing = []

[dependencies]
argon2 = "0.5"
bip39 = { version = "2", features = ["zeroize"] }
bitcoin = "0.32"
chacha20poly1305 = "0.10"
console = "0.15"
dialoguer = "0.11"
getrandom = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
zeroize = "1"

[profile.release]
overflow-checks = true
panic = "abort"
strip = true

