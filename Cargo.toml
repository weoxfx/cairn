[package]
name = "cairn"
version = "1.0.0"
edition = "2021"
description = "Self-custody Bitcoin wallet for the command line"
license = "MIT OR Apache-2.0"

[lib]
name = "cairn"
path = "src/lib.rs"
# Fuzz/integration surface. Unit tests belong to the binary target.
test = false
doctest = false

[features]
# Enables fuzzing-only entry points. The shipped binary never enables this.
fuzzing = []

[dependencies]
argon2 = "0.5"
bip39 = { version = "2", features = ["zeroize"] }
bitcoin = "0.32"
chacha20poly1305 = "0.10"
console = "0.15"
dialoguer = "0.11"
getrandom = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
primitive-types = "0.12"
qrcode = { version = "0.14", default-features = false }
rqrr = { version = "0.11", default-features = false }
secp256k1 = { version = "0.29", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"
ureq = { version = "2", features = ["json", "socks-proxy"] }
zeroize = "1"

[profile.release]
overflow-checks = true
panic = "abort"
strip = true
lto = "fat"
codegen-units = 1
incremental = false

